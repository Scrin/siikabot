name: test

on:
  pull_request:
    branches: [master]
  # main.yml runs the tests on every push to master, and publishes the image only once they pass
  workflow_call:

jobs:
  go-tests:
    runs-on: ubuntu-latest
    services:
      # Production's PostgreSQL, where the database tests make databases of their own (testutil/pgtest)
      postgres:
        image: postgres:18.7
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
      - name: Install libolm-dev
        run: sudo apt-get update && sudo apt-get install -y libolm-dev
      - name: Run Go tests
        env:
          SIIKABOT_TEST_POSTGRES: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
        run: go test -race ./...

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web_frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: web_frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm run test:run
